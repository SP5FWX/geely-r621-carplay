# 部署参数模板
# 复制为 local.properties 后修改；local.properties 已被 .gitignore 忽略

# 车机网络 ADB 地址（也可留空，由 tools/find_headunit.py 自动发现）
target=192.168.1.23:5555

# 车机本机蓝牙地址，格式 AA:BB:CC:DD:EE:FF
# 必须与车机原厂地址一致，否则已配对设备需要重新配对
bdaddr=AA:BB:CC:DD:EE:FF

# 本机 AOSP 5.1 (LMY48M) 二进制目录
aosp_dir=./vendor/aosp51

# 可选的「未打补丁」AOSP HAL 路径；install.sh --apply 时若 hal/build 下没有
# 打好的 bluetooth.default.so，会自动用 hal/patch_hal.py 打这个文件。
# stock_hal=./vendor/aosp51/bluetooth.default.so

# 平台签名材料（不要提交到仓库）
platform_key=./keys/platform.pk8
platform_cert=./keys/platform.x509.pem

# 需要禁用的原车蓝牙包，逗号分隔
disable_packages=com.ivt.bt,com.jsbd.btservice,ecarx.bluetooth.service,com.ecarx.btphone

# 备份目录
backup_dir=/data/local/aosp_bak
